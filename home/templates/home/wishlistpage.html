{% extends 'home/base.html' %}
{% load static %}
{% block categories %}
<h2>My Wishlist</h2>
{% for i in items %}
<div class="card mb-3" style="">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{ i.item.image.url}}" width="80" height="80">
    </div>
    <div class="col-md-8" style="">
      <div class="card-body">
        <h5 class="card-title">{{ i.item.name}}-{{i.item.price}}</h5>
      <a href="/wishlist_delete/{{i.id}}" class="btn btn-primary">Remove</a>
      </div>
    </div>
    {% endfor %}
      {% endblock %}
