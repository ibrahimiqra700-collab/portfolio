{% extends 'home/base.html' %}
{% load static %}
{% block categories %}
{% for card in cards %}
<div class="card">
    <div class="row">
        {%if card.item.image %}
        <img src="{{card.item.image.url }}" class="container" style="height:330px;width:450px;">
        {% else %}
        <p>no image found</p>
        {% endif %}
<div class=" container " style="background-color:pink;text-align:center;border:2px solid pink;display:flex;justify-content:center;margin:0px;">
    <div class="container" >
  <div class="card-header">{{card.item.name}}</div>
  <div class="card-body">
    <h5 class="card-title">Rs{{ card.item.price}}</h5>
      <a href="{% url 'plus' card.id %}" value="+" class="btn btn-primary btn-sm" >+</a>
    <h5 class="card-title">{{card.quantity}}</h5>
     <a href="{% url 'minus' card.id %}" value="-" class="btn btn-primary btn-sm">-</a>
      <h5 class="card_title">{{total}}</h5>
      <a href="{% url 'delete_card' card.id %}" class="btn btn-primary btn-sm">delete</a>
      <br>
      <a href="{% url 'checkout' %}"  class="btn btn-primary btm-sm" style="margin:20px;">Proced to checkout</a>
  </div>
        </div>
    </div>
</div>
    {% endfor %}
{% endblock %}
