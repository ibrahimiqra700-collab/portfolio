{% extends 'home/base.html' %}
{% load static %}
{% block content %}
<div class="container">
<div class="row">
{% for product in products%}
    <div class="col-md-4">
<div class="card" >
    <div class="mx-2 my-2">
    {% if product.image%}
  <img src="{{product.image.url}}" class="card-img-top" alt="{{product.image.url}}" style="height:330px; object-fit:cover;">
    {% else%}
    <h2>no image found</h2>
    {% endif %}
  </div>
  <div class="card-body">
    <h5 class="card-title">{{product.name}}</h5>
    <p class="card-text">{{product.description}}</p>
    <a href="#" class="btn btn-primary">{{product.price}}</a>
    <p class="card-text">{{product.category}}</p>
      <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary">Add_to-CART</a>
  </div>
    </div>
        </div>
    {% endfor %}
    </div>
</div>


{% endblock %}
